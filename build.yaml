framework: "net9.0"
owner: "flexunityteam"
overview: "Resolution, HDR, audio and rating badges on poster images, rendered in memory."
description: >
  Draws resolution (4K/1080p/720p/SD), HDR (DV/HDR10+/HDR10/HLG), best-audio
  (Atmos/DTS:X/TrueHD/DTS-HD) and community-rating badges onto poster images
  in memory while they are served - original files are never modified, and
  every client (Android TV, mobile, web, Infuse, ...) sees the badges.
  Fork of obxidion's Quality Overlay (GPL-3.0); see NOTICE for changes.
category: "Metadata"
changelog: "Add optional EpisodePosition override (separate badge corner for Episode images) to avoid client overlays."
artifacts:
